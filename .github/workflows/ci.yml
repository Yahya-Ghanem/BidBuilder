name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + tests on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bidbuilder
          POSTGRES_PASSWORD: bidbuilder_ci
          POSTGRES_DB: bidbuilder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidbuilder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build API
        run: dotnet build api/BidBuilder.Api.csproj -c Release --nologo
      - name: Test (integration against the Postgres service)
        run: dotnet test api.Tests/BidBuilder.Api.Tests.csproj -c Release --nologo --collect:"XPlat Code Coverage" --results-directory ./coverage
        env:
          # The test fixture builds its connection from these; the API under test
          # creates/migrates/seeds a throwaway DB per run on the service container.
          BIDBUILDER_TEST_PGHOST: localhost
          BIDBUILDER_TEST_PGPORT: "5432"
          POSTGRES_USER: bidbuilder
          POSTGRES_PASSWORD: bidbuilder_ci
          JWT_SECRET: ci-only-signing-key-at-least-32-characters-long-000
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: warn

  frontend:
    # Keep this job name exactly "Frontend (type-check)" — it's the required status
    # check in branch protection. It now also lints and runs unit tests.
    name: Frontend (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --legacy-peer-deps mirrors the web Dockerfile: React 19 / Next 16 are ahead of
      # some packages' peer ranges (eslint tooling included).
      - run: npm ci --legacy-peer-deps
      # 19.5: regenerate the OpenAPI TS client from the checked-in spec snapshot and
      # fail on any drift. The backend job ALSO has a contract-drift test that asserts
      # the live spec matches api-spec/openapi.json — together they prove the spec, the
      # client and the running API agree.
      - name: Regenerate OpenAPI client (drift gate)
        run: |
          npm run gen:api
          if ! git diff --exit-code lib/api-generated.d.ts; then
            echo "::error::lib/api-generated.d.ts is out of sync with api-spec/openapi.json."
            echo "Run 'npm run gen:api' locally and commit the result."
            exit 1
          fi
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test

  # 20.1 — happy-path E2E against the live stack. We boot the actual API + Next
  # server (not a mocked harness) so a regression in auth, tenant resolution,
  # seeding, or the component-split routing of 19.6 surfaces here. Runs after
  # the backend + frontend jobs because there's no point standing the full
  # stack up if the smaller checks already failed.
  e2e:
    name: E2E (Playwright happy-path)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bidbuilder
          POSTGRES_PASSWORD: bidbuilder_ci
          POSTGRES_DB: bidbuilder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidbuilder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The API picks these up via ConfigurationBinder. Development mode seeds
      # the baseline admin (admin@bidbuilder.local / Admin@12345) + the seeded
      # project (PRJ-2026-001) that the E2E asserts on.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=bidbuilder;Username=bidbuilder;Password=bidbuilder_ci;Maximum Pool Size=20"
      Jwt__SigningKey: "ci-only-signing-key-at-least-32-characters-long-000"
      # 19.3 background OTel collection isn't needed here and adds boot noise.
      OpenTelemetry__Enabled: "false"
      # The cascade runs INLINE so a publish flow doesn't race a Hangfire worker —
      # mirrors the api.Tests fixture.
      Hangfire__Enabled: "false"
      # 29.A.1 — the login rate limit runs at its strict default (10/60s/IP)
      # in CI too. Specs no longer sign in through /api/auth/login: each mints
      # a per-spec user via the dev-only /api/test/users endpoint and injects
      # the token (tests-e2e/_helpers/auth.ts). Only happy-path performs one
      # real UI login — well inside the default budget — so the f835459
      # PermitLimit=200 override is removed, not merely lowered.
      WEB_PORT: "3100"
      WEB_URL: "http://localhost:3100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install web deps
        run: npm ci --legacy-peer-deps
      - name: Build API (Release)
        run: dotnet build api/BidBuilder.Api.csproj -c Release --nologo
      - name: Start API
        # nohup + & detaches; the wait loop blocks until /healthz answers.
        # We capture the PID into $GITHUB_ENV so the cleanup step at the end
        # can stop it cleanly even when the job fails.
        run: |
          nohup dotnet run --no-build -c Release --project api/BidBuilder.Api.csproj \
            --urls "http://localhost:8081" > api.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/healthz > /dev/null 2>&1; then
              echo "API up after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8081/healthz > /dev/null || \
            (echo "::error::API never became healthy"; tail -100 api.log; exit 1)
      - name: Build web (production)
        # NEXT_PUBLIC_API_URL is baked into the bundle at build time → set it to
        # the API origin the browser will hit from the GH runner.
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8081"
      - name: Start web
        run: |
          nohup npx next start -p 3100 > web.log 2>&1 &
          echo "WEB_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3100/login > /dev/null 2>&1; then
              echo "Web up after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3100/login > /dev/null 2>&1 || \
            (echo "::error::Web never became healthy"; tail -100 web.log; exit 1)
      - name: Install Playwright Chromium
        run: npm run test:e2e:install
      - name: Playwright happy-path
        run: npm run test:e2e
      - name: Tail server logs on failure
        if: failure()
        run: |
          echo "===== api.log (last 200) ====="; tail -200 api.log || true
          echo "===== web.log (last 200) ====="; tail -200 web.log || true
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop background processes
        if: always()
        run: |
          [ -n "${API_PID:-}" ] && kill "$API_PID" 2>/dev/null || true
          [ -n "${WEB_PID:-}" ] && kill "$WEB_PID" 2>/dev/null || true
