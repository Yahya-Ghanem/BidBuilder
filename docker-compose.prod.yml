# BidBuilder PRODUCTION stack (self-contained — not an overlay).
#
# Differences from docker-compose.yml (local dev):
#   • A Caddy reverse proxy terminates TLS and is the ONLY service with host ports.
#     db / api / web publish no host ports — they're reachable only on the internal
#     network, so Postgres and the API are never exposed to the internet directly.
#   • The API runs as ASPNETCORE_ENVIRONMENT=Production, which activates the
#     fail-fast guards (strong Jwt:SigningKey, real AllowedOrigins, no localhost).
#   • No default admin / demo data is seeded unless you opt in (Seed__* below).
#
# Run:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required env (set in .env or your platform's secret store — see .env.example):
#   POSTGRES_PASSWORD      strong Postgres password
#   JWT_SECRET             >= 32 chars, not a CHANGE-ME/dev-only placeholder
#   PUBLIC_DOMAIN          public hostname, e.g. bid.example.com
#   PUBLIC_URL             public https URL, e.g. https://bid.example.com
#   ACME_EMAIL             contact email for Let's Encrypt
#   SEED_ADMIN_PASSWORD    password for the first admin (omit to skip seeding one)

name: bidbuilder-prod

services:
  db:
    image: postgres:16-alpine
    container_name: bidbuilder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-bidbuilder}
      POSTGRES_USER:     ${POSTGRES_USER:-bidbuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - dbdata:/var/lib/postgresql/data
      # 19.4 — WAL archiving for PITR. The archive_command below copies each
      # completed WAL segment into this volume; pg_basebackup (db-backup sidecar)
      # writes its base backups into the same volume so a restore has everything
      # in one place.
      - dbarchive:/var/lib/postgresql/archive
    # 19.4 — Postgres tuned for continuous archiving:
    #   • wal_level=replica           : minimum required to archive WAL.
    #   • archive_mode=on             : enables the archive_command.
    #   • archive_command             : refuses to overwrite an existing archived
    #     segment (test ! -f), then copies the new one; on failure Postgres will
    #     RETRY the segment indefinitely instead of recycling it, so a stuck
    #     archive shows up as growing pg_wal/ rather than silent data loss.
    #   • archive_timeout=300         : forces a WAL switch every 5 min, bounding
    #     the RPO when traffic is low.
    #   • max_wal_senders=3           : headroom for pg_basebackup -X stream and
    #     any future physical replica.
    #
    # The chown shim is needed because docker's named-volume mount lands with
    # root ownership; the postgres image only chowns PGDATA on initdb, not other
    # mount points. We chown WHILE the entrypoint is still running as root, then
    # exec the official entrypoint (which drops to the postgres user).
    entrypoint:
      - "sh"
      - "-c"
      - "chown -R postgres:postgres /var/lib/postgresql/archive && exec docker-entrypoint.sh \"$0\" \"$@\""
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f"
      - "-c"
      - "archive_timeout=300"
      - "-c"
      - "max_wal_senders=3"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidbuilder} -d ${POSTGRES_DB:-bidbuilder}"]
      interval: 5s
      timeout:  5s
      retries:  10
    networks: [bbnet]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bidbuilder-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS:        http://+:8080
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-bidbuilder};Username=${POSTGRES_USER:-bidbuilder};Password=${POSTGRES_PASSWORD};Maximum Pool Size=50;Timeout=15
      Jwt__SigningKey:    ${JWT_SECRET:?JWT_SECRET must be set (>= 32 chars, non-default)}
      # Same-origin in prod: the browser hits https://PUBLIC_DOMAIN and Caddy routes /api.
      AllowedOrigins:     ${PUBLIC_URL:?PUBLIC_URL must be set, e.g. https://bid.example.com}
      # First-run admin seed (no default credential ships to prod). Omit to skip.
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__AdminEmail:    ${SEED_ADMIN_EMAIL:-admin@bidbuilder.local}
      # Outbound email (21.1) — off unless Email__Enabled=true + host/From set. Same-origin
      # links default to PUBLIC_URL. The password is a secret; supply it via the environment.
      Email__Enabled:     ${EMAIL_ENABLED:-false}
      Email__Host:        ${EMAIL_HOST:-}
      Email__Port:        ${EMAIL_PORT:-587}
      Email__Username:    ${EMAIL_USERNAME:-}
      Email__Password:    ${EMAIL_PASSWORD:-}
      Email__UseSsl:      ${EMAIL_USE_SSL:-true}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName:    ${EMAIL_FROM_NAME:-BidBuilder}
      Email__AppBaseUrl:  ${EMAIL_APP_BASE_URL:-${PUBLIC_URL}}
    # Liveness probe on /healthz (no DB dependency) so a transient Postgres outage
    # doesn't get a healthy API killed, while web/Caddy still wait for it to come up.
    healthcheck:
      test:         ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 30s
    networks: [bbnet]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle; same public origin as the site.
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?PUBLIC_URL must be set, e.g. https://bid.example.com}
    container_name: bidbuilder-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [bbnet]

  # Scheduled Postgres backups. Takes a gzipped pg_dump every BACKUP_INTERVAL_SECONDS
  # (default daily) into the dbbackups volume, pruning dumps older than the retention
  # window. For true off-host durability, bind-mount a host path or sync the volume to
  # object storage — see docs/BACKUP.md.
  db-backup:
    image: postgres:16-alpine
    container_name: bidbuilder-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST:                  db
      PGUSER:                  ${POSTGRES_USER:-bidbuilder}
      PGPASSWORD:              ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE:              ${POSTGRES_DB:-bidbuilder}
      BACKUP_RETENTION_DAYS:   ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # 19.4 — base backup cadence + WAL retention. Each base backup creates a new
      # PITR restore point; WAL older than the OLDEST base backup we want to keep
      # is safe to drop. The sidecar takes a fresh base backup every
      # BASEBACKUP_INTERVAL_SECONDS (default weekly) and prunes WAL segments older
      # than WAL_RETENTION_DAYS (default 21 — covers two base-backup intervals so
      # we can always restore to the previous one).
      BASEBACKUP_INTERVAL_SECONDS: ${BASEBACKUP_INTERVAL_SECONDS:-604800}
      WAL_RETENTION_DAYS:          ${WAL_RETENTION_DAYS:-21}
    volumes:
      - ./deploy/backup:/scripts:ro
      - dbbackups:/backups
      # Same archive volume the db service writes to — the sidecar both reads (to
      # prune old WAL) and writes (basebackup output goes into /backups/base/).
      - dbarchive:/var/lib/postgresql/archive
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[backup] sidecar up; interval=${BACKUP_INTERVAL_SECONDS:-86400}s retention=${BACKUP_RETENTION_DAYS:-14}d";
        # First boot: take an immediate base backup so PITR has at least one
        # restore point even before the weekly cadence kicks in.
        sh /scripts/basebackup.sh || echo "[backup] initial basebackup FAILED at $(date -u +%FT%TZ)";
        # Run logical dump and base-backup loops in parallel so neither one blocks the other.
        (
          while true; do
            sh /scripts/backup.sh || echo "[backup] dump FAILED at $(date -u +%FT%TZ)";
            sleep "${BACKUP_INTERVAL_SECONDS:-86400}";
          done
        ) &
        while true; do
          sleep "${BASEBACKUP_INTERVAL_SECONDS:-604800}";
          sh /scripts/basebackup.sh || echo "[backup] basebackup FAILED at $(date -u +%FT%TZ)";
        done
    networks: [bbnet]

  caddy:
    image: caddy:2-alpine
    container_name: bidbuilder-caddy
    restart: unless-stopped
    depends_on:
      - web
      - api
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN must be set, e.g. bid.example.com}
      ACME_EMAIL:    ${ACME_EMAIL:?ACME_EMAIL must be set for Let's Encrypt}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [bbnet]

networks:
  bbnet:

volumes:
  dbdata:
  dbbackups:
  # 19.4 — continuous WAL archive. Lives next to dbdata so a single host backup
  # of /var/lib/docker/volumes covers both. For real disaster recovery (host
  # loss) sync this AND dbbackups off-host — see docs/BACKUP.md "Off-host durability".
  dbarchive:
  caddy_data:
  caddy_config:
